name: iOS Build and Test

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  ios:
    name: iOS Simulator
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Configure Gradle
        run: chmod +x gradlew

      - name: Show environment
        run: |
          java -version
          xcodebuild -version
          uname -m

      - name: Run Kotlin Multiplatform tests
        shell: bash
        run: |
          if [[ "$(uname -m)" == "arm64" ]]; then
            ./gradlew iosSimulatorArm64Test --stacktrace
          else
            ./gradlew iosX64Test --stacktrace
          fi

      - name: Build iOS Simulator app
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "$GITHUB_WORKSPACE/build/ios-simulator"

          xcodebuild build \
            -project iosApp/iosApp.xcodeproj \
            -target QuestAndReward \
            -configuration Debug \
            -sdk iphonesimulator \
            CODE_SIGNING_ALLOWED=NO \
            CONFIGURATION_BUILD_DIR="$GITHUB_WORKSPACE/build/ios-simulator" \
            | tee "$GITHUB_WORKSPACE/build/xcodebuild.log"

      - name: Package Simulator app
        run: |
          app="$GITHUB_WORKSPACE/build/ios-simulator/QuestAndReward.app"
          plist="$app/Info.plist"

          plutil -lint "$plist"
          test "$(plutil -extract CFBundleIdentifier raw "$plist")" = "com.phanstal.questandreward"
          test "$(plutil -extract CFBundleShortVersionString raw "$plist")" = "0.54"
          test "$(plutil -extract CFBundleVersion raw "$plist")" = "18"
          test "$(plutil -extract CFBundleExecutable raw "$plist")" = "QuestAndReward"
          test "$(plutil -extract CFBundlePackageType raw "$plist")" = "APPL"

          ditto -c -k --sequesterRsrc --keepParent \
            "$app" \
            "$GITHUB_WORKSPACE/build/QuestAndReward-iOS-Simulator.zip"
          shasum -a 256 "$GITHUB_WORKSPACE/build/QuestAndReward-iOS-Simulator.zip"

      - name: Upload Simulator app
        uses: actions/upload-artifact@v4
        with:
          name: QuestAndReward-iOS-Simulator
          path: build/QuestAndReward-iOS-Simulator.zip
          if-no-files-found: error

      - name: Upload Xcode diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: QuestAndReward-Xcode-Diagnostics
          path: build/xcodebuild.log
          if-no-files-found: ignore
