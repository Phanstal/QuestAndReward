name: iOS Build and Test

on:
  workflow_dispatch:
    inputs:
      preview_release:
        description: Build and publish v0.55 prerelease for manual testing without full acceptance
        type: boolean
        default: false
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  ios:
    name: iOS Simulator
    permissions:
      contents: write
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Configure Gradle
        run: chmod +x gradlew

      - name: Select App Store toolchain
        run: |
          sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Restore Kotlin Native cache
        id: native-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.konan
          key: konan-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('gradle/libs.versions.toml') }}

      - name: Show environment
        run: |
          java -version
          xcodebuild -version
          uname -m

      - name: Run Kotlin Multiplatform tests
        shell: bash
        run: |
          if [[ "$(uname -m)" == "arm64" ]]; then
            ./gradlew iosSimulatorArm64Test --stacktrace
          else
            ./gradlew iosX64Test --stacktrace
           fi

      - name: Boot iPhone Simulator
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/build"
          simulator_udid="$(xcrun simctl list devices available -j | jq -r '[.devices["com.apple.CoreSimulator.SimRuntime.iOS-26-2"][] | select(.name == "iPhone 16")][0].udid')"
          test -n "$simulator_udid"
          test "$simulator_udid" != "null"
          echo "SIMULATOR_UDID=$simulator_udid" >> "$GITHUB_ENV"
          xcrun simctl boot "$simulator_udid" 2>/dev/null || true
          xcrun simctl bootstatus "$simulator_udid" -b | tee "$GITHUB_WORKSPACE/build/ios-simulator-boot.log"

      - name: Run StoreKit and iOS UI tests
        if: ${{ !inputs.preview_release }}
        timeout-minutes: 25
        shell: bash
        run: |
          set -o pipefail
          xcodebuild test \
            -project iosApp/iosApp.xcodeproj \
            -scheme QuestAndReward \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -parallel-testing-enabled NO \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 180 \
            -maximum-test-execution-time-allowance 600 \
            -resultBundlePath "$GITHUB_WORKSPACE/build/QuestAndRewardTests.xcresult" \
            | tee "$GITHUB_WORKSPACE/build/xcode-test.log"

      - name: Build arm64 Simulator app
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "$GITHUB_WORKSPACE/build/ios-arm64"

          xcodebuild build \
            -project iosApp/iosApp.xcodeproj \
            -scheme QuestAndReward \
            -configuration Debug \
            -sdk iphonesimulator \
            -arch arm64 \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            CONFIGURATION_BUILD_DIR="$GITHUB_WORKSPACE/build/ios-arm64" \
            | tee "$GITHUB_WORKSPACE/build/xcodebuild-arm64.log"

      - name: Build unsigned Release archive
        if: ${{ !inputs.preview_release }}
        shell: bash
        run: |
          set -o pipefail
          xcodebuild archive \
            -project iosApp/iosApp.xcodeproj \
            -scheme QuestAndReward \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$GITHUB_WORKSPACE/build/QuestAndReward.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            | tee "$GITHUB_WORKSPACE/build/xcodebuild-archive.log"
          plutil -lint "$GITHUB_WORKSPACE/build/QuestAndReward.xcarchive/Products/Applications/QuestAndReward.app/PrivacyInfo.xcprivacy"

      - name: Verify public privacy policy
        run: |
          policy_url="https://github.com/Phanstal/QuestAndReward/blob/77377b1e0006d72fc2577631ad0a278a25a98a17/docs/privacy-policy.md"
          curl --fail --location --retry 2 --max-time 30 "$policy_url" -o "$RUNNER_TEMP/quest-privacy-policy.html"
          grep -q 'QuestAndReward Privacy Policy' "$RUNNER_TEMP/quest-privacy-policy.html"

      - name: Build x86_64 Simulator app
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "$GITHUB_WORKSPACE/build/ios-x86_64"

          xcodebuild build \
            -project iosApp/iosApp.xcodeproj \
            -scheme QuestAndReward \
            -configuration Debug \
            -sdk iphonesimulator \
            -arch x86_64 \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            CONFIGURATION_BUILD_DIR="$GITHUB_WORKSPACE/build/ios-x86_64" \
            | tee "$GITHUB_WORKSPACE/build/xcodebuild-x86_64.log"

      - name: Create universal Simulator app
        shell: bash
        run: |
          set -euo pipefail
          arm_app="$GITHUB_WORKSPACE/build/ios-arm64/QuestAndReward.app"
          x64_app="$GITHUB_WORKSPACE/build/ios-x86_64/QuestAndReward.app"
          universal_dir="$GITHUB_WORKSPACE/build/ios-simulator"
          universal_app="$universal_dir/QuestAndReward.app"

          mkdir -p "$universal_dir"
          ditto "$arm_app" "$universal_app"
          lipo -create \
            "$arm_app/QuestAndReward" \
            "$x64_app/QuestAndReward" \
            -output "$universal_app/QuestAndReward"
          lipo "$universal_app/QuestAndReward" -verify_arch arm64 x86_64

      - name: Install and cold launch
        shell: bash
        run: |
          set -euo pipefail
          marker="$GITHUB_WORKSPACE/build/ios-cold-launch-start"
          touch "$marker"
          xcrun simctl uninstall "$SIMULATOR_UDID" com.phanstal.questandreward 2>/dev/null || true
          xcrun simctl install "$SIMULATOR_UDID" "$GITHUB_WORKSPACE/build/ios-simulator/QuestAndReward.app"
          xcrun simctl launch --terminate-running-process "$SIMULATOR_UDID" com.phanstal.questandreward
          sleep 8
          xcrun simctl io "$SIMULATOR_UDID" screenshot "$GITHUB_WORKSPACE/build/ios-cold-launch.png"

          crash_file="$(find \
            "$HOME/Library/Logs/DiagnosticReports" \
            "$HOME/Library/Developer/CoreSimulator/Devices/$SIMULATOR_UDID/data/Library/Logs/CrashReporter" \
            -type f \( -name 'QuestAndReward*.ips' -o -name 'QuestAndReward*.crash' \) \
            -newer "$marker" -print -quit 2>/dev/null || true)"
          if [[ -n "$crash_file" ]]; then
            echo "QuestAndReward crash report: $crash_file"
            cp "$crash_file" "$GITHUB_WORKSPACE/build/"
            exit 1
          fi

      - name: Package Simulator app
        run: |
          app="$GITHUB_WORKSPACE/build/ios-simulator/QuestAndReward.app"
          plist="$app/Info.plist"

          plutil -lint "$plist"
          test "$(plutil -extract CFBundleIdentifier raw "$plist")" = "com.phanstal.questandreward"
          test "$(plutil -extract CFBundleShortVersionString raw "$plist")" = "0.55"
          test "$(plutil -extract CFBundleVersion raw "$plist")" = "19"
          test "$(plutil -extract CFBundleExecutable raw "$plist")" = "QuestAndReward"
          test "$(plutil -extract CFBundlePackageType raw "$plist")" = "APPL"
          test "$(plutil -extract CADisableMinimumFrameDurationOnPhone raw "$plist")" = "true"

          ditto -c -k --sequesterRsrc --keepParent \
            "$app" \
            "$GITHUB_WORKSPACE/build/QuestAndReward-v0.55-ios-simulator.zip"
          shasum -a 256 "$GITHUB_WORKSPACE/build/QuestAndReward-v0.55-ios-simulator.zip"

      - name: Upload Simulator app
        uses: actions/upload-artifact@v4
        with:
          name: QuestAndReward-v0.55-iOS-Simulator
          path: build/QuestAndReward-v0.55-ios-simulator.zip
          if-no-files-found: error

      - name: Publish manual-testing prerelease
        if: ${{ inputs.preview_release }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create v0.55 \
            "$GITHUB_WORKSPACE/build/QuestAndReward-v0.55-ios-simulator.zip" \
            --target "$GITHUB_SHA" --prerelease \
            --title "v0.55 Preview — manual simulator testing" \
            --notes "Manual-testing prerelease, not a completed acceptance release. Includes the Compose startup Info.plist fix missing from v0.54. Version 0.55 (19), universal arm64/x86_64 iOS Simulator app, not an IPA. This run builds, installs and cold-launches the packaged app; full StoreKit/UI acceptance and signed device Archive are not run in preview mode. Full UI acceptance remains incomplete. StoreKit simulation requires the source project and its StoreKit configuration in Xcode. Source: $GITHUB_SHA. Build evidence: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Export iOS test evidence
        if: always()
        shell: bash
        run: |
          if [[ -d "$GITHUB_WORKSPACE/build/QuestAndRewardTests.xcresult" ]]; then
            xcrun xcresulttool get test-results summary \
              --path "$GITHUB_WORKSPACE/build/QuestAndRewardTests.xcresult" \
              > "$GITHUB_WORKSPACE/build/ios-test-summary.json" || true
            xcrun xcresulttool export attachments \
              --path "$GITHUB_WORKSPACE/build/QuestAndRewardTests.xcresult" \
              --output-path "$GITHUB_WORKSPACE/build/ios-test-attachments" || true
          fi

      - name: Upload Xcode diagnostics
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: QuestAndReward-Xcode-Diagnostics
          path: |
            build/*.xcresult
            build/xcode-test.log
            build/ios-simulator-boot.log
            build/xcodebuild-*.log
            build/ios-cold-launch.png
            build/QuestAndReward*.ips
            build/QuestAndReward*.crash
            build/ios-test-summary.json
            build/ios-test-attachments/
          if-no-files-found: ignore

      - name: Upload iOS acceptance evidence
        if: always() && hashFiles('build/ios-test-summary.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: QuestAndReward-iOS-Acceptance
          path: |
            build/ios-test-summary.json
            build/ios-test-attachments/
            build/ios-cold-launch.png
          if-no-files-found: error

      - name: Save Kotlin Native cache
        if: always() && steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.konan
          key: ${{ steps.native-cache.outputs.cache-primary-key }}
